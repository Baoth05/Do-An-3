server:
  port: 8081 # Cổng của WMS Core

spring:
  application:
    name: wms-core-service

  # Cấu hình Database
  datasource:
    url: jdbc:postgresql://localhost:5432/wms_core_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # Cấu hình Redis Cache
  data:
    redis:
      host: localhost
      port: 6379

  # Cấu hình Message Broker (RabbitMQ)
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  instance:
    prefer-ip-address: true
    # 🌟 BỔ SUNG DÒNG NÀY ĐỂ ÉP EUREKA DÙNG TÊN ĐỊNH DANH CHUẨN XÁC
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/