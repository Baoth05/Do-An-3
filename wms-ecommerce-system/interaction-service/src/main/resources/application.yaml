server:
  port: 8083 # Cổng của Interaction Service[cite: 2]

spring:
  application:
    name: interaction-service

  datasource:
    url: jdbc:postgresql://localhost:5432/inter_db # Database riêng[cite: 2]
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

# Khóa bí mật nội bộ (phải trùng với api-gateway). Đặt biến môi trường INTERNAL_SECRET khi triển khai thật.
internal:
  secret: ${INTERNAL_SECRET:ctut-internal-dev-secret-change-me}

# Địa chỉ nội bộ các service phụ thuộc
services:
  order-url: ${ORDER_URL:http://order-service}  # Tên service trên Eureka (gọi qua @LoadBalanced RestTemplate, có timeout)
