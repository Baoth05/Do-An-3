server:
  port: 8082 # Cổng của Order Service[cite: 2]

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5432/order_db # Database riêng[cite: 2]
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # Cấu hình Redis Cache[cite: 2]
  data:
    redis:
      host: localhost
      port: 6379

  # Cấu hình Message Broker (RabbitMQ)[cite: 2]
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/