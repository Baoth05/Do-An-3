server:
  port: 8082 # Cổng của Order Service

spring:
  application:
    name: order-service
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:postgresql://localhost:5432/order_db # Database riêng
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  # Cấu hình Redis Cache
  data:
    redis:
      host: localhost
      port: 6379

  # Cấu hình Message Broker (RabbitMQ)
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

# Khóa bí mật nội bộ (phải trùng với api-gateway). Đặt biến môi trường INTERNAL_SECRET khi triển khai thật.
internal:
  secret: ${INTERNAL_SECRET:ctut-internal-dev-secret-change-me}

# Địa chỉ nội bộ các service phụ thuộc
services:
  wms-url: ${WMS_URL:http://wms-core-service}  # Tên service trên Eureka (gọi qua @LoadBalanced RestTemplate, có timeout)

# Thanh toán online (MoMo/Crypto): quá thời hạn chưa thanh toán thì tự hủy đơn & nhả tồn kho
order:
  payment-timeout-minutes: ${ORDER_PAYMENT_TIMEOUT_MINUTES:30}
  payment-timeout-check-ms: 300000

# Voucher mẫu (CTUT50K, SHOP1OFF10...): mặc định tắt, bật SEED_DEMO_VOUCHERS=true khi cần demo
app:
  seed:
    demo-vouchers: ${SEED_DEMO_VOUCHERS:false}
