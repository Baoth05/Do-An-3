server:
  port: 8082 # Cổng của Order Service

spring:
  application:
    name: order-service
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:postgresql://localhost:5432/order_db # Database riêng
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # Cấu hình Redis Cache
  data:
    redis:
      host: localhost
      port: 6379

  # Cấu hình Message Broker (RabbitMQ)
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
