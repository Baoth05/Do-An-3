server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      # 🌟 Cấu hình CORS toàn cục cho Gateway (Đã căn chỉnh chuẩn YAML)
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5174"
              - "http://localhost:5173"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/auth/**

        - id: wms-core-service-public
          uri: lb://wms-core-service
          predicates:
            - Path=/products/**, /categories/**
            - Method=GET

        - id: wms-core-service-prefix
          uri: lb://wms-core-service
          predicates:
            - Path=/wms/**
          filters:
            - StripPrefix=1
            - AuthenticationFilter

        - id: wms-core-service
          uri: lb://wms-core-service
          predicates:
            - Path=/products/**, /categories/**, /inventory/**, /warehouses/**, /suppliers/**, /export-notes/**, /import-notes/**, /shippers/**
          filters:
            - AuthenticationFilter

        - id: order-service-vouchers-public
          uri: lb://order-service
          predicates:
            - Path=/vouchers/**
            - Method=GET

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/orders/**, /vouchers/**
          filters:
            - AuthenticationFilter

        - id: payment-service-public
          uri: lb://payment-service
          predicates:
            - Path=/payments/momo-ipn, /payments/mock-success/**, /payments/mock-success-order/**, /payments/status/**, /payments/confirm-manual/**

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payments/**
          filters:
            - AuthenticationFilter

        - id: interaction-service-public
          uri: lb://interaction-service
          predicates:
            - Path=/interactions/**
            - Method=GET

        - id: interaction-service
          uri: lb://interaction-service
          predicates:
            - Path=/interactions/**
          filters:
            - AuthenticationFilter

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/