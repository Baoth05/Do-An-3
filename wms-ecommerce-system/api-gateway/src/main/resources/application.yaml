server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      # 🌟 Giải quyết Vấn đề 1: Cấu hình CORS toàn cục cho Gateway
      globalcors:
        cors-configurations:
          '[/**]': # Áp dụng cho mọi đường dẫn
            allowedOrigins: "*" # Chấp nhận mọi Frontend (React/Vue). Khi lên thực tế có thể đổi thành http://localhost:3000
            allowedMethods: "*" # Chấp nhận mọi HTTP Method (GET, POST, PUT, DELETE...)
            allowedHeaders: "*" # Chấp nhận mọi Header (bao gồm cả Authorization)

      routes:
        # 🌟 Giải quyết Vấn đề 3: Bỏ StripPrefix=1 vì Controller đã có sẵn @RequestMapping("/auth")
        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/auth/**

        - id: wms-core-service
          uri: lb://wms-core-service
          predicates:
            - Path=/wms/**
          filters:
            # Nếu wms Controller chưa có @RequestMapping("/wms") thì giữ lại StripPrefix, nếu có rồi thì cậu xóa nốt dòng này nhé!
            - StripPrefix=1
            - AuthenticationFilter

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/orders/**
          filters:
            - AuthenticationFilter # Đã bỏ StripPrefix=1

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payments/**
          filters:
            - AuthenticationFilter # Đã bỏ StripPrefix=1

        - id: interaction-service
          uri: lb://interaction-service
          predicates:
            - Path=/interactions/**
          filters:
            - AuthenticationFilter # Đã bỏ StripPrefix=1

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/