server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      # Cấu hình CORS toàn cục cho Gateway cho phép mọi cổng frontend cục bộ
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:5174"
              - "http://localhost:5175"
              - "http://localhost:5176"
              - "http://localhost:3000"
              - "http://localhost:3001"
              - "http://127.0.0.1:5173"
              - "http://127.0.0.1:5174"
              - "http://127.0.0.1:5175"
              - "http://127.0.0.1:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        # 1. Identity Service
        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/auth, /auth/**

        # 2. WMS Core Service (Có tiền tố /wms/**)
        - id: wms-core-service-prefix
          uri: lb://wms-core-service
          predicates:
            - Path=/wms/**
          filters:
            - StripPrefix=1

        # 3. WMS Core Service (Truy cập trực tiếp)
        - id: wms-core-service-direct
          uri: lb://wms-core-service
          predicates:
            - Path=/products, /products/**, /categories, /categories/**, /inventory, /inventory/**, /warehouses, /warehouses/**, /stores, /stores/**, /stock-cards, /stock-cards/**, /suppliers, /suppliers/**, /export-notes, /export-notes/**, /import-notes, /import-notes/**, /shippers, /shippers/**, /shipping-providers, /shipping-providers/**, /transfers, /transfers/**, /supply-contracts, /supply-contracts/**

        # 4. Order Service
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/orders, /orders/**, /vouchers, /vouchers/**

        # 5. Payment Service
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payments, /payments/**

        # 6. Interaction Service
        - id: interaction-service
          uri: lb://interaction-service
          predicates:
            - Path=/interactions, /interactions/**, /binh-luan, /binh-luan/**, /danh-gia, /danh-gia/**

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

# Khóa bí mật nội bộ giữa Gateway và các microservice (đặt biến môi trường INTERNAL_SECRET khi triển khai thật)
internal:
  secret: ${INTERNAL_SECRET:ctut-internal-dev-secret-change-me}

# Khóa ký JWT (Base64) - phải khớp với identity-service. Đặt biến môi trường JWT_SECRET khi triển khai thật.
jwt:
  secret: ${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
