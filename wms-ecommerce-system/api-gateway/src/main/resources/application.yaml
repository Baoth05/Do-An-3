server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      # Cấu hình CORS toàn cục cho Gateway cho phép mọi cổng frontend cục bộ
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:5174"
              - "http://localhost:5175"
              - "http://localhost:5176"
              - "http://localhost:3000"
              - "http://localhost:3001"
              - "http://127.0.0.1:5173"
              - "http://127.0.0.1:5174"
              - "http://127.0.0.1:5175"
              - "http://127.0.0.1:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        # 1. Identity Service
        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/auth/**

        # 2. WMS Core Service (Có tiền tố /wms/**)
        - id: wms-core-service-prefix
          uri: lb://wms-core-service
          predicates:
            - Path=/wms/**
          filters:
            - StripPrefix=1

        # 3. WMS Core Service (Truy cập trực tiếp)
        - id: wms-core-service-direct
          uri: lb://wms-core-service
          predicates:
            - Path=/products/**, /categories/**, /inventory/**, /warehouses/**, /stores/**, /stock-cards/**, /suppliers/**, /export-notes/**, /import-notes/**, /shippers/**, /shipping-providers/**, /transfers/**

        # 4. Order Service
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/orders/**, /vouchers/**

        # 5. Payment Service
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payments/**

        # 6. Interaction Service
        - id: interaction-service
          uri: lb://interaction-service
          predicates:
            - Path=/interactions/**, /binh-luan/**, /danh-gia/**

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
