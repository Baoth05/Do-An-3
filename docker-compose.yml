# ==============================================================================
# CTUT GEAR - WMS & Sàn TMĐT B2B2C: khởi động toàn bộ hệ thống bằng 1 lệnh
#   cp .env.example .env        (sửa các khóa bí mật nếu cần)
#   docker compose up -d --build
#
# Truy cập:  Sàn TMĐT  http://localhost:5173  |  Admin  http://localhost:5174
#            WMS Kho   http://localhost:5175  |  Gateway http://localhost:8080
#            Eureka    http://localhost:8761
# Chỉ Gateway được mở cổng ra ngoài; các microservice chỉ truy cập được trong mạng nội bộ Docker.
# ==============================================================================

x-backend-env: &backend-env
  DB_USERNAME: ${DB_USERNAME:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-123456}
  INTERNAL_SECRET: ${INTERNAL_SECRET:-ctut-internal-dev-secret-change-me}
  JWT_SECRET: ${JWT_SECRET:-5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
  EUREKA_URL: http://discovery-server:8761/eureka/
  SPRING_JPA_SHOW_SQL: "false"

x-backend-common: &backend-common
  restart: on-failure
  depends_on:
    postgres:
      condition: service_healthy
    discovery-server:
      condition: service_started

services:
  # ---------------------------------------------------------------- Hạ tầng
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Mở cổng 5433 để xem dữ liệu bằng DBeaver/IntelliJ mà không đụng PostgreSQL cài sẵn trên máy (5432)
    ports:
      - "5433:5432"

  discovery-server:
    build:
      context: ./wms-ecommerce-system
      args:
        SERVICE: discovery-server
    ports:
      - "8761:8761"

  # ---------------------------------------------------------------- Microservices
  api-gateway:
    build:
      context: ./wms-ecommerce-system
      args:
        SERVICE: api-gateway
    environment:
      <<: *backend-env
    ports:
      - "8080:8080"
    restart: on-failure
    depends_on:
      - discovery-server

  identity-service:
    <<: *backend-common
    build:
      context: ./wms-ecommerce-system
      args:
        SERVICE: identity-service
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/identity_db
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-admin}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-123456}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}

  wms-core-service:
    <<: *backend-common
    build:
      context: ./wms-ecommerce-system
      args:
        SERVICE: wms-core-service
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wms_core_db
      CONTRACT_SIGN_PIN: ${CONTRACT_SIGN_PIN:-123456}

  order-service:
    <<: *backend-common
    build:
      context: ./wms-ecommerce-system
      args:
        SERVICE: order-service
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      ORDER_PAYMENT_TIMEOUT_MINUTES: ${ORDER_PAYMENT_TIMEOUT_MINUTES:-30}
      SEED_DEMO_VOUCHERS: ${SEED_DEMO_VOUCHERS:-false}

  payment-service:
    <<: *backend-common
    build:
      context: ./wms-ecommerce-system
      args:
        SERVICE: payment-service
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      MOMO_REDIRECT_URL: ${MOMO_REDIRECT_URL:-http://localhost:5173/payment-result}
      MOMO_IPN_URL: ${MOMO_IPN_URL:-http://localhost:8080/payments/momo-ipn}

  interaction-service:
    <<: *backend-common
    build:
      context: ./wms-ecommerce-system
      args:
        SERVICE: interaction-service
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inter_db

  # ---------------------------------------------------------------- Frontend
  ecommerce-frontend:
    build:
      context: ./ecommerce-frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        VITE_API_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-http://localhost:8080}
    ports:
      - "5173:80"
    depends_on:
      - api-gateway

  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        VITE_API_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-http://localhost:8080}
    ports:
      - "5174:80"
    depends_on:
      - api-gateway

  wms-frontend:
    build:
      context: ./wms-frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        VITE_API_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-http://localhost:8080}
    ports:
      - "5175:80"
    depends_on:
      - api-gateway

volumes:
  pgdata:
